name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # La imagen oficial no habilita SSL y, por defecto, el cliente exige TLS verificado.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci?sslmode=disable
      DATABASE_SSL: disable
      # Valores falsos: el build no debe conectarse a servicios reales.
      BETTER_AUTH_SECRET: ci-secret-no-usar-en-produccion-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      RESEND_API_KEY: re_ci
      QSTASH_TOKEN: ci
      QSTASH_CURRENT_SIGNING_KEY: ci
      QSTASH_NEXT_SIGNING_KEY: ci
      GOOGLE_CLIENT_ID: ci
      GOOGLE_CLIENT_SECRET: ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migraciones y seed en una base limpia
        run: |
          pnpm db:migrate
          pnpm db:seed
      - run: pnpm build
